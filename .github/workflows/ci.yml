name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm run test

      - name: Lint
        run: npm run lint

      - name: Prisma Validate
        run: npm run prisma:validate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pfc_api

      - name: Prisma Generate
        run: npm run prisma:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pfc_api

      - name: Validate changelog
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep -q "^CHANGELOG.md$" \
            || (echo "CHANGELOG.md não foi atualizado" && exit 1)