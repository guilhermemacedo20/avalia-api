services:
  postgres:
    image: postgres:16-alpine
    container_name: pfc-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: educacao
      POSTGRES_PASSWORD: educacao
      POSTGRES_DB: educacao_provas
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: